[project]
name = "telegram-tool-for-trader"
version = "0.1.0"
description = "Telegram bot for traders: price alerts, trading journal, position calculator"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]==21.6",
    "SQLAlchemy[asyncio]==2.0.36",
    "asyncpg==0.29.0",
    "aiosqlite==0.20.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "httpx==0.27.2",
    "websockets==13.1",
    "APScheduler==3.10.4",
    "yfinance==0.2.48",
    "aiohttp==3.10.10",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
